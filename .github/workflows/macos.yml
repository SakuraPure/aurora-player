# macOS 测试构建：在 GitHub 的 Mac 机器上打通用安装包（Apple 芯片 + Intel），产物在本次运行页面的 Artifacts 里下载。
# 手动触发：GitHub 仓库 → Actions → macOS 构建 → Run workflow；或 gh workflow run macos.yml
# 没有 Apple 开发者账号，只做 ad-hoc 签名（tauri.macos.conf.json）；更新签名私钥不上传到 GitHub，所以这里不生成自动更新包。
name: macOS 构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: 构建通用安装包
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
